name: Generate cards

on:
  schedule:
    - cron: "0 3 */3 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-repository-cards-${{ github.ref }}
  cancel-in-progress: false

env:
  CARD_OPTIONS: title_color=333&text_color=333&icon_color=555&border_color=ddd&bg_color=fefefe&border_radius=2&show_owner=true&username=essentialkaos

jobs:
  generate:
    name: Generate ${{ matrix.repo }} card
    runs-on: ubuntu-latest
    timeout-minutes: 5

    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        repo:
          - ek
          - rbinstall
          - rpmbuilder
          - webkaos
          - bibop
          - kaos-repo
          - translit
          - perfecto
          - sslcli
          - aligo
          - branca
          - go-confluence
          - sslscan
          - go-badge
          - rds
          - path
          - rep

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Generate pin card
        uses: readme-tools/github-readme-stats-action@v2
        with:
          card: pin
          options: ${{ env.CARD_OPTIONS }}&repo=${{ matrix.repo }}
          path: .cards/${{ matrix.repo }}.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload generated card
        uses: actions/upload-artifact@v7
        with:
          name: card-${{ matrix.repo }}
          path: .cards/${{ matrix.repo }}.svg
          if-no-files-found: error
          retention-days: 1

  commit:
    name: Commit updated cards
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download generated cards
        uses: actions/download-artifact@v8
        with:
          pattern: card-*
          path: .cards
          merge-multiple: true

      - name: Commit and push changes
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- .cards/

          if git diff --cached --quiet; then
            echo "Cards are already up to date"
            exit 0
          fi

          git commit -m "chore(cards): update repository cards"
          git push origin "HEAD:${BRANCH}"
